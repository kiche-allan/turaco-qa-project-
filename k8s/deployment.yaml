apiVersion: apps/v1
kind: Deployment
metadata:
  name: claims-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: claims-api
  template:
    metadata:
      labels:
        app: claims-api
    spec:
      containers:
      - name: backend
        image: your-docker-hub/claims-api:latest
        ports:
        - containerPort: 8080
        env:
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: db-password
              key: password
