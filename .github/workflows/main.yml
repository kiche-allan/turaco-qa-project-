name: Turaco QA & Security Pipeline
on: [push]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      # 1. Setup Java
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      # 2. Security Scan (SCA) - Optional (requires SNYK_TOKEN secret)
      - name: Snyk Security Scan
        if: ${{ secrets.SNYK_TOKEN != '' }}
        uses: snyk/actions/maven@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high

      # 3. Build Backend with Maven
      - name: Build Backend with Maven
        run: mvn -f backend/pom.xml clean package -DskipTests

      # 4. Run Backend Unit Tests
      - name: Run Backend Unit Tests
        run: mvn -f backend/pom.xml test

      # 5. Build Automation Tests
      - name: Build Automation Tests
        run: mvn -f automation/pom.xml clean test-compile

      # 6. Run Selenium Tests (Headless)
      - name: Run Selenium Tests
        run: mvn -f automation/pom.xml test -Dbrowser=headless-chrome
        continue-on-error: true

      # 7. Build Docker Image (Optional)
      - name: Build Docker Image
        run: docker build -t claims-api:latest ./backend
        continue-on-error: true

      # 8. Upload Test Results (Optional)
      - name: Publish Test Results
        if: always()
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: |
            backend/target/surefire-reports/*.xml
            automation/target/surefire-reports/*.xml
        continue-on-error: true
