version: '3.8'
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: turaco_admin
      POSTGRES_PASSWORD: TuracoSecure2026
      POSTGRES_DB: claims_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U turaco_admin"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/claims_db
      SPRING_DATASOURCE_USERNAME: turaco_admin
      SPRING_DATASOURCE_PASSWORD: TuracoSecure2026
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_SHOW_SQL: "true"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
