# Spring Boot Configuration
spring.application.name=claims-backend

# Database Configuration (Local Development)
spring.datasource.url=jdbc:postgresql://localhost:5432/claims_db
spring.datasource.username=turaco_admin
spring.datasource.password=TuracoSecure2026
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQL15Dialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true

# Server Configuration
server.port=8080

# Actuator for Health Checks
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
